name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: System 1 (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked

  python:
    name: System 2, sim and API (Python)
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa            # no GPU on the runner: software offscreen rendering
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: py/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6 libgl1
      - run: pip install -e "./py[llm]"
      # The closed-loop tests run in real time (a simulation cannot be sped up: System 2 plans on a wall-clock cadence), so this takes a few minutes.
      - run: python -m pytest py/tests -q

  docker:
    name: Docker image runs a real task
    runs-on: ubuntu-latest
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t policyserve .
      - run: docker run -d --name ps -p 127.0.0.1:8000:8000 --shm-size=256m policyserve
      - run: scripts/smoke.sh http://127.0.0.1:8000
      - if: failure()
        run: docker logs ps
